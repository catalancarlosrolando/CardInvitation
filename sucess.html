<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <title>Exito</title>
</head>

<body class="m-0 p-0 overflow-x-hidden font-sans antialiased text-slate-800">
    <div class="w-full flex flex-col">

        <section
            class="relative z-[60] w-full h-[100dvh] bg-gradient-to-r from-slate-100 to-cyan-100 flex flex-col justify-center items-center p-6 shrink-0 rounded-tl-[60px] shadow-2xl">
            <!-- start animations-->
            <div class="absolute inset-0 z-10 pointer-events-none overflow-hidden">

                <svg class="absolute top-[10%] left-[5%] w-4 h-4 text-sky-300 animate-ping opacity-80"
                    style="animation-duration: 2s;" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                </svg>
                <svg class="absolute bottom-[15%] left-[12%] w-5 h-5 text-cyan-200 animate-ping opacity-70"
                    style="animation-duration: 2.8s;" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                </svg>
                <svg class="absolute top-[60%] left-[8%] w-3 h-3 text-sky-400 animate-ping opacity-60"
                    style="animation-duration: 2.3s;" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                </svg>

                <svg class="absolute top-[30%] left-[15%] w-6 h-6 text-sky-400 animate-pulse opacity-50"
                    style="animation-duration: 4s;" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                </svg>
                <svg class="absolute bottom-[35%] left-[6%] w-4 h-4 text-sky-300 animate-pulse opacity-70"
                    style="animation-duration: 3s;" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                </svg>

                <div class="absolute top-[45%] left-[18%] w-1.5 h-1.5 bg-sky-200 rounded-full animate-ping"
                    style="animation-duration: 1.7s;"></div>
                <div class="absolute bottom-[10%] left-[4%] w-1 h-1 bg-cyan-100 rounded-full animate-pulse"
                    style="animation-duration: 2.5s;"></div>


                <svg class="absolute top-[15%] right-[8%] w-5 h-5 text-cyan-200 animate-ping opacity-90"
                    style="animation-duration: 1.9s;" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                </svg>
                <svg class="absolute bottom-[20%] right-[12%] w-4 h-4 text-sky-300 animate-ping opacity-70"
                    style="animation-duration: 2.4s;" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                </svg>
                <svg class="absolute top-[50%] right-[15%] w-3 h-3 text-sky-400 animate-ping opacity-60"
                    style="animation-duration: 2.9s;" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                </svg>

                <svg class="absolute top-[35%] right-[5%] w-7 h-7 text-sky-400 animate-pulse opacity-40"
                    style="animation-duration: 4.5s;" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                </svg>
                <svg class="absolute bottom-[40%] right-[7%] w-5 h-5 text-sky-300 animate-pulse opacity-60"
                    style="animation-duration: 3.2s;" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                </svg>

                <div class="absolute top-[25%] right-[18%] w-2 h-2 bg-sky-100 rounded-full animate-pulse"
                    style="animation-duration: 3s;"></div>
                <div class="absolute bottom-[15%] right-[4%] w-1.5 h-1.5 bg-cyan-200 rounded-full animate-ping"
                    style="animation-duration: 2.1s;"></div>
            </div>
            <!--end-->
            <div class="w-full max-w-md mx-auto bg-white rounded-[32px] p-6 sm:p-8 shadow-xl border border-slate-100">

                <div class="mb-8 text-center">
                    <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight mb-2">¡Gracias por confirmar tu
                        asistencia!</h2>
                    <p class="text-slate-500 text-sm">Si quieres agregar más invitados, haz click en volver.</p>
                </div>


                <div class="mb-8 text-center">

                    <a href="/"
                        class="w-full bg-sky-300 hover:bg-sky-500 text-white font-bold text-base py-4 px-6 rounded-xl shadow-lg shadow-indigo-500/20 transition-all active:scale-[0.98] mt-6">
                        Volver
                    </a>
                </div>

            </div>
        </section>
    </div>
</body>

</html>
